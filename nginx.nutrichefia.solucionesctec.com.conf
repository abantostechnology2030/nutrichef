# nutrichefia.solucionesctec.com -> Express en :4005 (API + frontend + /uploads).
#
# El dominio de acceso es nutrichefia.solucionesctec.com (cambiado el 10-ago-2026).
# El anterior, nutrichef.solucionesctec.com, NO se apago: redirige con 301 al nuevo, para que
# los enlaces guardados, la PWA ya instalada y cualquier marcador sigan funcionando. El
# certificado cubre los dos nombres (certbot --expand), asi que la redireccion tambien va por
# HTTPS: si el viejo no tuviera cert valido, el navegador mostraria un aviso de seguridad ANTES
# de poder redirigir, que es justo lo que hay que evitar.

# ===== App (dominio nuevo) =====
server {
    server_name nutrichefia.solucionesctec.com;

    location / {
        proxy_pass http://localhost:4005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # El escaner sube DOS imagenes (8MB c/u por multer): con 12M da 413.
        client_max_body_size 20M;
        # Generar/verificar con IA tarda hasta ~190s medidos; el default de 60s da 504.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nutrichef.solucionesctec.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nutrichef.solucionesctec.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ===== Dominio viejo: 301 al nuevo, conservando la ruta =====
server {
    server_name nutrichef.solucionesctec.com;

    # $request_uri conserva la ruta y la query, asi que un enlace a
    # /despensa.html?inicio=... aterriza en el mismo sitio del dominio nuevo.
    return 301 https://nutrichefia.solucionesctec.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nutrichef.solucionesctec.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nutrichef.solucionesctec.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ===== HTTP -> HTTPS para los dos nombres =====
server {
    listen 80;
    listen [::]:80;
    server_name nutrichefia.solucionesctec.com nutrichef.solucionesctec.com;
    return 301 https://$host$request_uri;
}
