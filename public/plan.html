<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriChefIA — Plan de comidas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/img/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/img/favicon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#124819" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="hamb">☰</button>
        <h2>Plan de comidas</h2>
        <div class="spacer"></div>
        <span class="analisis-pill" id="pill-gen">…</span>
      </header>

      <div class="content stack">
        <div id="alerta-plan" class="alert"></div>

        <!-- Falta configurar hogar o despensa -->
        <div class="card hidden" id="aviso-setup" style="border-color:#ffe2b8;background:var(--amber-soft)">
          <h3 style="color:var(--amber)" id="setup-titulo"></h3>
          <p class="muted" id="setup-texto"></p>
          <a class="btn btn-sm" id="setup-link" style="margin-top:10px">Configurar</a>
        </div>

        <!-- Las instrucciones van ANTES del selector de fechas y en amarillo: son lo primero
             que hay que leer, y dentro de la tarjeta del selector se perdian entre los botones.
             Es la misma familia de color que el resto de avisos de la app. -->
        <div class="card instrucciones">
          <h3>📋 Instrucciones</h3>
          <ol class="pasos-plan">
            <li><b>Elige la semana</b> que vas a programar con las flechas de abajo.</li>
            <li><b>Genera la semana</b> (o cada día por separado con su botón).</li>
            <li>Ya generados, en cada plato puedes <b>ver el detalle</b>, <b>cambiarlo</b> por otro de tus platos o <b>pedirle otro a la IA</b>.</li>
          </ol>
        </div>

        <!-- Selector de semana -->
        <div class="card card-tint">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div class="row" style="gap:8px;align-items:center">
              <button class="btn btn-ghost btn-sm" id="btn-prev">‹</button>
              <div style="text-align:center;min-width:190px">
                <b id="lbl-semana">…</b>
                <div class="muted" style="font-size:12px" id="lbl-semana-sub"></div>
              </div>
              <button class="btn btn-ghost btn-sm" id="btn-next">›</button>
              <button class="btn btn-ghost btn-sm" id="btn-hoy">Hoy</button>
            </div>
            <!-- No hay boton de "generar la semana": la unidad es el DIA y su boton vive
                 en la cabecera de cada dia del calendario. -->
            <div class="row barra-acciones" style="gap:8px;flex-wrap:wrap">
              <button class="btn btn-sm" id="btn-semana">✨ Generar la semana</button>
              <button class="btn btn-ghost btn-sm hidden" id="btn-detallar">🍳 Completar platos</button>
              <!-- Lista de compras y despensa: solo con el modulo de despensa activo. Sin
                   inventario no hay con que comparar, asi que "lo que falta" no significa nada. -->
              <button class="btn btn-ghost btn-sm hidden" id="btn-faltantes">🛒 Lista de compras</button>
              <!-- Abre la despensa con la proyeccion de LA SEMANA VISIBLE (le pasa inicio/fin).
                   Sin eso, la despensa siempre proyectaba la semana ACTUAL: mirabas el plan del
                   13/07 y las barras te hablaban del 27/07. -->
              <button class="btn btn-ghost btn-sm" id="btn-despensa"
                title="Abre tu despensa con lo que se lleva la semana que estás viendo">🧺 Ver mi despensa</button>
              <button class="btn btn-ghost btn-sm" id="btn-compras"
                title="Arma la lista de esta semana, marcala en el supermercado y anota precios">🧾 Compras de la semana</button>
              <span class="separador-acciones"></span>
              <button class="btn btn-sm btn-copiar" id="btn-copiar"
                title="Trae a esta semana los platos que ya programaste en otra">📋 Copiar datos de otra semana (repetir)</button>
            </div>
          </div>
          <p class="muted" style="font-size:12.5px;margin-top:10px" id="lbl-limites"></p>
          <div id="badge-periodo" style="font-size:12.5px;margin-top:8px"></div>
        </div>

        <!-- Calendario -->
        <div id="calendario" class="stack"></div>
      </div>
    </div>
  </div>

  <img class="mascota" src="/img/mascota-plan.png" alt="" aria-hidden="true" />

  <script src="/js/api.js"></script>
  <script>
    const U = exigirSesion();
    document.getElementById('sidebar').innerHTML = pintarSidebar('plan');
    activarMenuMovil();

    const alPlan = document.getElementById('alerta-plan');
    let DATA = null;
    let semana = null; // lunes YYYY-MM-DD
    // Cupo de IA agotado para la semana que se esta viendo. Lo fija pintarLimites() y lo
    // leen los botones de generar de cada dia/casilla, que se pintan despues.
    let sinCupo = false;
    // Falta hogar o despensa: sin eso la IA no puede proponer nada (el backend responde
    // 409). Lo fija avisoSetup(), que corre DESPUES del primer pintado.
    let setupPendiente = false;

    // Motivo por el que no se puede generar ahora, o null si se puede. Fuente unica para
    // todos los botones de IA del calendario.
    function bloqueoGen() {
      if (setupPendiente) return 'Configura tu hogar y tu despensa antes de generar';
      if (sinCupo) return 'Agotaste las generaciones de IA de esta semana';
      return null;
    }

    const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const sumar = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const fmtCorto = (iso) => { const [y, m, d] = iso.split('-'); return `${parseInt(d, 10)} ${MESES[+m - 1]}`; };
    // Fecha real de un dia de la semana. El array del backend es 0=Domingo, pero la
    // semana empieza el lunes: el domingo (0) es el septimo dia, no el primero.
    const fechaDe = (dia) => sumar(semana, dia === 0 ? 6 : dia - 1);
    const hoyISO = () => new Date(Date.now() - 5 * 3600 * 1000).toISOString().slice(0, 10); // Peru UTC-5

    // ===== Pintado =====
    function pintarLimites(l) {
      const g = l.generaciones_max == null ? '∞' : `${l.generaciones_usadas}/${l.generaciones_max}`;
      document.getElementById('pill-gen').innerHTML = `✨ ${g} generaciones`;
      const partes = [
        l.generaciones_max == null
          ? 'Generaciones de IA ilimitadas.'
          : `Usaste ${l.generaciones_usadas} de ${l.generaciones_max} generación(es) de IA para esta semana. Generar un día cuesta una.`,
      ];
      if (l.semanas_max != null) partes.push(`Semanas programables: ${l.semanas_usadas}/${l.semanas_max}.`);
      document.getElementById('lbl-limites').textContent = partes.join(' ');

      sinCupo = l.generaciones_max != null && l.generaciones_usadas >= l.generaciones_max;
    }

    // ===== Aporte nutricional (plato.info) =====
    // El semaforo usa las mismas clases del escaner. Ojo: la BD dice "ambar" y la clase
    // del CSS se llama "amarillo" (viene del escaner) — de ahi el mapeo.
    const SEM_CLASE = { verde: 'sem-verde-bn', ambar: 'sem-amarillo-bn', rojo: 'sem-rojo-bn' };
    const SEM_TXT = { verde: 'Saludable', ambar: 'Ocasional', rojo: 'No le conviene' };
    const NIVEL_TXT = { alto: 'alto', medio: 'medio', bajo: 'bajo' };

    // Tag compacto para la casilla: punto de color + kcal. Si la IA no dio semaforo pero
    // si calorias (o al reves), se pinta lo que haya en vez de no pintar nada.
    function tagNutri(info) {
      if (!info) return '';
      const clase = SEM_CLASE[info.semaforo] || '';
      const kcal = info.calorias ? `${info.calorias} kcal` : (SEM_TXT[info.semaforo] || '');
      if (!clase && !kcal) return '';
      const titulo = [SEM_TXT[info.semaforo], info.resumen].filter(Boolean).join(' · ');
      return `<span class="tag ${clase}" title="${esc(titulo)}">${clase ? '<span class="sem-dot"></span>' : ''}${esc(kcal)}</span>`;
    }

    // Bloque completo para el modal: semaforo + macros + micronutrientes + resumen.
    // Si el plato aun no tiene info (lo genero un menu viejo), invita a analizarlo.
    function bloqueNutri(info) {
      if (!info) {
        return `<div class="reco-foto" style="margin-top:12px">
          🥗 Este plato todavía no tiene su información nutricional.
          Usa <b>“Analizar nutrición”</b> arriba para calcularla con IA.
        </div>`;
      }
      const macro = (etiqueta, nivel) =>
        nivel ? `<span class="tag">${etiqueta}: ${NIVEL_TXT[nivel] || nivel}</span>` : '';
      const macros = [
        macro('Carbohidratos', info.carbohidratos),
        macro('Proteínas', info.proteinas),
        macro('Grasas', info.grasas),
      ].filter(Boolean).join('');

      const clase = SEM_CLASE[info.semaforo] || '';
      const banner = info.semaforo
        ? `<div class="sem-banner ${clase}" style="margin-bottom:10px">
             <span class="sem-dot"></span>
             <span>${SEM_TXT[info.semaforo]}${info.calorias ? ` · ~${info.calorias} kcal por porción` : ''}</span>
           </div>`
        : (info.calorias ? `<p style="font-size:13px;margin-bottom:10px"><b>~${info.calorias} kcal</b> por porción</p>` : '');

      // Barras horizontales con el % del valor diario. La barra mide el %VD (no el valor
      // absoluto): son unidades distintas —gramos, miligramos— y pintarlas en la misma escala
      // haria que 581 mg de sodio se viera 20 veces mas "grande" que 29 g de proteina.
      // Se topa en 100 para que un nutriente pasado de rosca no rompa la fila, pero el numero
      // real se sigue mostrando al lado.
      const NUTRI_TXT = {
        carbohidratos: ['Carbohidratos', 'g'], proteinas: ['Proteína', 'g'], grasas: ['Grasas', 'g'],
        fibra: ['Fibra', 'g'], hierro: ['Hierro', 'mg'], sodio: ['Sodio', 'mg'], sal: ['Eq. de sal', 'g'],
      };
      // Sodio y sal en exceso importan mas que el resto en un hogar con hipertension: por
      // encima del 20% del valor diario se pintan en ambar y por encima del 40% en rojo.
      const tonoNutri = (clave, vd) => {
        if (vd == null) return '';
        if ((clave === 'sodio' || clave === 'sal') && vd >= 40) return ' barra-alta';
        if ((clave === 'sodio' || clave === 'sal') && vd >= 20) return ' barra-media';
        return '';
      };
      const fmtNum = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100));

      const filas = [];
      if (info.calorias) {
        filas.push({ txt: 'Energía', uni: 'kcal', v: info.calorias, vd: info.calorias_vd, clave: 'energia' });
      }
      for (const [clave, [txt, uni]] of Object.entries(NUTRI_TXT)) {
        const n = info.nutrientes && info.nutrientes[clave];
        if (n) filas.push({ txt, uni, v: n.v, vd: n.vd, clave });
      }
      // Cada fila es pulsable y explica ESE nutriente: que es, que significa su numero y a
      // quien de la familia le importa. La etiqueta entera es el boton (no solo el icono) para
      // que se vea que hay algo que tocar y para que el area de toque sirva en el telefono.
      const tabla = filas.length
        ? `<div class="nutri-tabla">${filas.map((f) => `
            <div class="nutri-fila">
              <button type="button" class="nutri-txt nutri-info" data-nutri="${f.clave}"
                data-v="${f.v}" data-uni="${f.uni}" data-vd="${f.vd == null ? '' : f.vd}"
                title="¿Qué significa este número?">${f.txt} <span class="nutri-ic" aria-hidden="true">i</span></button>
              <span class="nutri-val">${fmtNum(f.v)} <span class="nutri-uni">${f.uni}</span></span>
              <span class="nutri-barra"><i style="width:${Math.max(2, Math.min(100, f.vd ?? 0))}%" class="${tonoNutri(f.clave, f.vd)}"></i></span>
              <span class="nutri-vd">${f.vd == null ? '' : f.vd + '%'}</span>
            </div>`).join('')}</div>`
        : '';

      // Los platos generados antes de este formato no traen numeros: se sigue mostrando lo que
      // si tienen (las etiquetas alto/medio/bajo) en vez de dejar el bloque vacio.
      const sinNumeros = !filas.length && macros;

      // Las recomendaciones por integrante van PRIMERO y en su propia caja: en un hogar con
      // diabetes o hipertension es lo mas importante de esta pantalla, y perdidas entre los
      // numeros no se leen.
      const recos = (info.recomendaciones || []).length
        ? `<div class="nutri-recos">
             <b>👨‍👩‍👧 Para tu familia</b>
             <ul>${info.recomendaciones.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
           </div>`
        : '';

      return `<div class="nutri-caja">
        <div class="nutri-cab">
          <b>🥗 Aporte nutricional</b>
          <span class="muted">por porción</span>
        </div>
        ${banner}
        ${recos}
        ${tabla}
        ${sinNumeros ? `<div class="row" style="gap:5px;flex-wrap:wrap;margin:8px 0">${macros}</div>` : ''}
        ${info.destacados?.length
          ? `<p style="font-size:12.5px;margin:10px 0 0">✨ <b>Aporta:</b> ${info.destacados.map(esc).join(', ')}</p>`
          : ''}
        ${info.resumen ? `<p class="muted" style="font-size:12.5px;margin-top:6px">${esc(info.resumen)}</p>` : ''}
        <p class="muted" style="font-size:11.5px;margin-top:10px">
          👆 Toca cualquier nutriente para saber qué es y qué significa su número.<br />
          🥗 Estimación orientativa por porción; el % es sobre un valor diario de referencia de
          2000 kcal. No reemplaza la consulta con un nutricionista.
        </p>
      </div>`;
    }

    // ===== Que significa cada nutriente =====
    //
    // Se explica AQUI, en el navegador, y no se le pide a la IA: es lo mismo para todos los
    // platos, asi que pedirlo seria pagar una y otra vez por el mismo texto (y arriesgar que
    // salga distinto en cada plato). Lo unico que cambia por hogar son las condiciones medicas,
    // y esas ya las tenemos.
    //
    // "mas es mejor" (fibra, hierro, proteina) vs. "cuidar el exceso" (sodio, grasas...): sin
    // esa distincion, un 30% de fibra y un 30% de sodio se leerian igual, y no son lo mismo.
    const NUTRI_GUIA = {
      energia: {
        ic: '🔥', nombre: 'Energía (calorías)', masEsMejor: false,
        que: 'Es el combustible que le da al cuerpo una porción de este plato. Una persona adulta necesita alrededor de 2000 calorías al día repartidas entre todas sus comidas.',
        exceso: 'Comer más calorías de las que se gastan es lo que hace subir de peso.',
        ojo: [
          { claves: ['diabetes'], txt: 'con diabetes conviene mantener porciones parejas entre un día y otro, para que el azúcar no suba y baje de golpe' },
          { claves: ['sobrepeso', 'obesidad'], txt: 'si se está bajando de peso, este es el número que más conviene mirar' },
        ],
      },
      carbohidratos: {
        ic: '🍚', nombre: 'Carbohidratos', masEsMejor: false,
        que: 'Son el arroz, la papa, el camote, los fideos, el pan y los azúcares. Es de donde el cuerpo saca la energía del día a día.',
        exceso: 'Dentro del cuerpo se convierten en glucosa, o sea azúcar en la sangre. Cuanto más grande la porción, más sube.',
        ojo: [
          { claves: ['diabetes'], txt: 'es EL número a vigilar: mide la porción y acompáñalos con verduras y proteína, que hacen que el azúcar entre más despacio' },
          { claves: ['sobrepeso', 'obesidad'], txt: 'suelen ser la parte más fácil de recortar del plato' },
        ],
      },
      proteinas: {
        ic: '🍗', nombre: 'Proteínas', masEsMejor: true,
        que: 'Vienen de la carne, el pescado, el huevo, la leche y las menestras. Sirven para mantener y reparar los músculos y para las defensas.',
        exceso: '',
        ojo: [
          { claves: ['anemia'], txt: 'las carnes y la sangrecita aportan proteína y hierro a la vez' },
          { claves: ['renal', 'riñon', 'rinon'], txt: 'con problemas del riñón el exceso de proteína sí importa: consúltalo con su médico' },
        ],
      },
      grasas: {
        ic: '🫗', nombre: 'Grasas', masEsMejor: false,
        que: 'Son el aceite, la mantequilla, las frituras y la grasa propia de las carnes. Dan energía y ayudan a aprovechar algunas vitaminas.',
        exceso: 'De más suben el colesterol y cargan el corazón. No es lo mismo el aceite de oliva o la palta que la fritura.',
        ojo: [
          { claves: ['colesterol'], txt: 'es el número que le pidieron cuidar' },
          { claves: ['hipertension', 'presion alta', 'corazon'], txt: 'la grasa y el sodio juntos son los que más cargan al corazón' },
          { claves: ['sobrepeso', 'obesidad'], txt: 'es lo que más calorías aporta por bocado' },
        ],
      },
      fibra: {
        ic: '🥬', nombre: 'Fibra', masEsMejor: true,
        que: 'Está en las verduras, las frutas con cáscara, las menestras y los granos integrales. El cuerpo no la digiere, y por eso ayuda a ir al baño con regularidad.',
        exceso: '',
        ojo: [
          { claves: ['diabetes'], txt: 'es una buena aliada: hace que el azúcar del plato entre más lento a la sangre' },
          { claves: ['estreñimiento', 'estrenimiento', 'colon'], txt: 'es justo lo que le hace falta, y acompañada de bastante agua' },
        ],
      },
      hierro: {
        ic: '🩸', nombre: 'Hierro', masEsMejor: true,
        que: 'Está en la sangrecita, el hígado, las carnes rojas y las menestras. Es lo que lleva el oxígeno por la sangre.',
        exceso: 'Cuando falta aparece la anemia: cansancio, sueño y falta de concentración. Acompañarlo con limón o fruta cítrica ayuda a aprovecharlo mejor.',
        ojo: [
          { claves: ['anemia'], txt: 'es EL número a vigilar en esta familia' },
          { claves: ['embarazo', 'gestante'], txt: 'en el embarazo hace falta bastante más de lo normal' },
        ],
      },
      sodio: {
        ic: '🧂', nombre: 'Sodio', masEsMejor: false,
        que: 'Viene sobre todo de la sal, pero también del cubito, la sillao, los embutidos y las conservas. El cuerpo lo necesita en poca cantidad.',
        exceso: 'De más hace retener líquidos y sube la presión arterial.',
        ojo: [
          { claves: ['hipertension', 'presion alta'], txt: 'es EL número a vigilar: cambia el cubito y la sillao por ajo, cebolla, culantro y limón' },
          { claves: ['renal', 'riñon', 'rinon', 'corazon'], txt: 'con problemas de riñón o del corazón hay que bajarlo aún más' },
        ],
      },
      sal: {
        ic: '🥄', nombre: 'Equivalente en sal', masEsMejor: false,
        que: 'Es el mismo sodio de la fila anterior, pero contado como sal de mesa, que es como uno la ve en la cocina. Una cucharadita rasa son unos 5 gramos.',
        exceso: 'La recomendación general es no pasar de una cucharadita de sal en TODO el día, sumando lo que ya traen los alimentos.',
        ojo: [
          { claves: ['hipertension', 'presion alta'], txt: 'de aquí sale la indicación de "baja la sal" que le dieron' },
        ],
      },
    };

    // Los integrantes del hogar, para poder decir A QUIEN le importa cada nutriente por su
    // nombre. Se pide una vez y en segundo plano: si falla, las explicaciones siguen saliendo
    // (sin la parte de la familia), que es mejor que no explicar nada.
    let INTEGRANTES = [];
    api('/api/hogar').then((h) => { INTEGRANTES = h.integrantes || []; }).catch(() => {});

    const sinTildes = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    // Quien de la familia tiene alguna de esas condiciones.
    function quienesTienen(claves) {
      return INTEGRANTES.filter((i) => (i.condiciones || []).some((c) => {
        const t = sinTildes(c);
        return claves.some((k) => t.includes(sinTildes(k)));
      })).map((i) => i.nombre);
    }

    // La regla del 5 y el 20 (la que usan las tablas nutricionales): por debajo del 5% del
    // valor diario el aporte es bajo; del 20% para arriba es alto. Sirve para los dos sentidos,
    // solo cambia si eso es una buena o una mala noticia.
    function lecturaVD(vd, masEsMejor) {
      if (vd == null || !Number.isFinite(vd)) return null;
      if (vd < 5) return masEsMejor
        ? { txt: 'Aporte bajo', det: 'Este plato casi no lo aporta; búscalo en otra comida del día.', tono: 'ambar' }
        : { txt: 'Aporte bajo', det: 'Una cantidad pequeña dentro de todo el día.', tono: 'verde' };
      if (vd < 20) return { txt: 'Aporte moderado', det: 'Una parte razonable de lo del día.', tono: 'verde' };
      return masEsMejor
        ? { txt: 'Aporte alto', det: 'Con una porción cubres buena parte de lo del día. Buena noticia.', tono: 'verde' }
        : { txt: 'Aporte alto', det: 'Una sola porción se lleva buena parte de lo de todo el día. Conviene no repetirlo en la cena.', tono: 'ambar' };
    }

    // Modal de un nutriente. No usa IA: se arma con la guia de arriba + las condiciones del hogar.
    function explicarNutriente(clave, valor, unidad, vd) {
      const g = NUTRI_GUIA[clave];
      if (!g) return;
      const lec = lecturaVD(vd, g.masEsMejor);
      const avisos = (g.ojo || [])
        .map((o) => ({ nombres: quienesTienen(o.claves), txt: o.txt }))
        .filter((o) => o.nombres.length);

      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:480px;text-align:left">
        <h3>${g.ic} ${esc(g.nombre)}</h3>
        <div class="modal-body">
          <div class="nutri-dato">
            <b>${esc(String(valor))} ${esc(unidad)}</b> por porción
            ${vd !== '' && vd != null ? `<span class="nutri-dato-vd">${vd}% de lo del día</span>` : ''}
          </div>
          ${lec ? `<p class="nutri-lectura ${lec.tono}"><b>${lec.txt}.</b> ${lec.det}</p>` : ''}
          <p style="font-size:13px;line-height:1.6;margin-bottom:10px"><b>¿Qué es?</b> ${esc(g.que)}</p>
          ${g.exceso ? `<p style="font-size:13px;line-height:1.6;margin-bottom:10px">${esc(g.exceso)}</p>` : ''}
          ${avisos.length ? `<div class="nutri-recos" style="margin:12px 0">
              <b>👨‍👩‍👧 En tu familia</b>
              <ul>${avisos.map((a) => `<li><b>${a.nombres.map(esc).join(' y ')}</b>: ${esc(a.txt)}.</li>`).join('')}</ul>
            </div>` : ''}
          <p class="muted" style="font-size:11.5px;line-height:1.55;margin-top:12px">
            De dónde sale el número: lo estima la IA a partir de los ingredientes del plato y del
            número de porciones. Es una orientación, no un análisis de laboratorio, y no reemplaza
            lo que le indique su médico o nutricionista.
          </p>
        </div>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-sm" type="button" data-cerrar>Entendido</button></div>
      </div>`;
      document.body.appendChild(back);
      const cerrar = () => back.remove();
      back.querySelector('[data-cerrar]').onclick = cerrar;
      back.onclick = (e) => { if (e.target === back) cerrar(); };
    }

    // Delegado en el documento: el bloque nutricional vive dentro de un modal que se crea y se
    // destruye, asi que enganchar el listener a ese modal obligaria a repetirlo en cada sitio
    // que lo abre.
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-nutri]');
      if (!b) return;
      explicarNutriente(b.dataset.nutri, b.dataset.v, b.dataset.uni,
        b.dataset.vd === '' ? null : Number(b.dataset.vd));
    });

    function casillaHTML(dia, momento, it) {
      const mi = MOMENTO_INFO[momento];
      const bloqueo = bloqueoGen();
      if (!it) {
        // DOS vias. "Escribe un plato" se retiro de aqui: esa forma de crear vive ahora en
        // "Mis platos", que es donde el plato queda guardado para reutilizarlo. Aqui el
        // usuario o deja que se le proponga, o elige de su biblioteca a mano.
        const t = bloqueo ? ` disabled title="${bloqueo}"` : '';
        return `<div class="casilla vacia">
          <span class="casilla-momento"><span class="mom-ic">${mi.ic}</span>${mi.txt}</span>
          <span class="muted" style="font-size:12px">Sin plato</span>
          <div class="row" style="gap:5px;flex-wrap:wrap;justify-content:center">
            <button class="btn btn-ghost btn-sm" data-gen="${dia}:${momento}" style="padding:3px 9px;font-size:11px"
              title="Usa uno de tus platos guardados; si no encaja ninguno, lo propone la IA"${t}>✨ Proponer</button>
            <button class="btn btn-ghost btn-sm" data-lib="${dia}:${momento}" style="padding:3px 9px;font-size:11px" title="Elegir uno de mis platos">📋 Mis platos</button>
          </div>
        </div>`;
      }
      const p = it.plato;
      // "tengo todo" / "falta N" comparan contra la DESPENSA: sin ese modulo no significan
      // nada (nada falta porque no hay inventario contra el que comparar). Lo mismo con
      // "marcar como cocinado", cuyo unico efecto es descontar stock.
      const falta = U.despensa_activa
        ? (p.faltantes.length
          ? `<span class="tag tag-falta" title="${p.faltantes.join(', ')}">🛒 falta ${p.faltantes.length}</span>`
          : '<span class="tag tag-ok">✓ tengo todo</span>')
        : '';
      const tiempo = p.tiempo_min ? `<span class="tag">⏱ ${p.tiempo_min}′</span>` : '';
      const btnCocinado = U.despensa_activa
        ? `<button class="btn btn-ghost btn-sm" data-cocinado="${it.id}" title="${it.cocinado ? 'Marcar como no cocinado' : 'Marcar como cocinado'}">${it.cocinado ? '✓' : '○'}</button>`
        : '';
      // Orden de las acciones: primero VER lo que hay, luego cambiarlo TU (de tu biblioteca)
      // y por ultimo pedirle otro a la IA. De lo mas barato y reversible a lo que gasta cupo.
      return `<div class="casilla ${it.cocinado ? 'cocinado' : ''}">
        <span class="casilla-momento"><span class="mom-ic">${mi.ic}</span>${mi.txt}</span>
        <span class="casilla-plato">${p.nombre}</span>
        <div class="casilla-meta">${tagNutri(p.info)}${tiempo}${falta}</div>
        <div class="casilla-acciones">
          <button class="btn btn-ghost btn-sm" data-ver="${it.id}" title="Ver la receta y el aporte nutricional">Ver</button>
          <button class="btn btn-ghost btn-sm" data-lib="${dia}:${momento}" title="Cambiarlo por uno de tus platos guardados">📋 Plato</button>
          <button class="btn btn-ghost btn-sm" data-gen="${dia}:${momento}" title="${bloqueo || 'Que la IA proponga otro'}"${bloqueo ? ' disabled' : ''}>✨ Otro</button>
          ${btnCocinado}
          <button class="btn btn-danger btn-sm" data-del="${it.id}" title="Quitar">✕</button>
        </div>
      </div>`;
    }

    function pintar() {
      const d = DATA;
      document.getElementById('lbl-semana').textContent = `${fmtCorto(semana)} — ${fmtCorto(sumar(semana, 6))}`;
      document.getElementById('lbl-semana-sub').textContent = semana === d.semana_actual ? 'Semana actual' : '';
      pintarLimites(d.limites);

      // "Completar platos" es BACKFILL: los platos nuevos ya nacen con receta, nutricion y
      // el "consume" de cada ingrediente, asi que el boton solo aparece si hay alguno al que
      // le falte algo (los genero una version anterior). Es una llamada a la IA y consume
      // cupo: no se ofrece si no haria nada. El backend ademas responde gratis si no hay
      // pendientes. El criterio de "incompleto" tiene que ser el MISMO que el del backend
      // (ver POST /detallar): si aqui faltara el consume, el boton no aparecería nunca para
      // los platos viejos y su despensa seguiria bajando por la heuristica; y si aqui fuera
      // "alguno" en vez de "ninguno", el boton se quedaria encendido para siempre en cuanto
      // la IA omitiera un ingrediente, cobrando una generacion por clic.
      const sinConsume = (p) => {
        const ings = p.ingredientes || [];
        return ings.length > 0 && ings.every((i) => !Number.isFinite(Number(i?.consume)));
      };
      // OJO: este criterio DEBE coincidir con el del backend (/detallar). Si aqui falta un
      // caso, el boton no aparece para platos que si estan incompletos; y si sobra, se queda
      // encendido cobrando una generacion por clic sin arreglar nada.
      //
      // Un plato con info del formato VIEJO (calorias + alto/medio/bajo, sin "nutrientes")
      // cuenta como incompleto: le faltan hierro, fibra, sodio y el resto del detalle.
      const sinNutrientes = (p) => !p.info || !p.info.nutrientes || !Object.keys(p.info.nutrientes).length;
      const incompletos = d.dia_orden.reduce((n, dia) => n + d.momentos.filter((m) => {
        const it = d.plan[dia][m];
        return it && (sinNutrientes(it.plato) || !it.plato.pasos || sinConsume(it.plato));
      }).length, 0);
      const btnDet = document.getElementById('btn-detallar');
      btnDet.classList.toggle('hidden', incompletos === 0 || !!bloqueoGen());
      // Antes decia solo "Completar platos (3)" y nadie sabia QUE se completaba (el usuario
      // pregunto que significaba). Ahora lo dice el propio boton.
      btnDet.textContent = `🍳 Completar recetas (${incompletos})`;
      btnDet.title = `${incompletos} plato(s) de esta semana no tienen su receta o su información nutricional.`
        + ' Esto se la pide a la IA de una sola vez (cuesta una generación).';

      const hoy = hoyISO();
      document.getElementById('calendario').innerHTML = d.dia_orden.map((dia) => {
        const fecha = fechaDe(dia);
        const llenas = d.momentos.filter((m) => d.plan[dia][m]).length;

        // El boton del dia es la via principal de generacion. Su texto dice lo que va a
        // hacer de verdad: con casillas libres las LLENA (sin tocar lo que ya hay, sea
        // manual o generado); con el dia lleno solo puede rehacerlo, y eso se confirma.
        const bloqueoDia = bloqueoGen();
        const btnDia = bloqueoDia
          ? `<button class="btn btn-sm" disabled title="${bloqueoDia}" style="padding:3px 9px;font-size:11px">✨ Generar día</button>`
          : `<button class="btn ${llenas === 0 ? '' : 'btn-ghost '}btn-sm" data-gen-dia="${dia}" style="padding:3px 9px;font-size:11px"
               title="${llenas === 3 ? 'Rehacer los 3 platos de este día' : `Generar ${3 - llenas} plato(s) con IA`}">
               ✨ ${llenas === 3 ? 'Rehacer día' : 'Generar día'}</button>`;

        return `
          <div class="dia-fila ${fecha === hoy ? 'hoy ' : ''}${llenas === 0 ? 'sin-programar' : ''}">
            <div class="dia-cab">
              <div>
                <span class="dia-nombre">${d.dias[dia]}</span>
                <span class="dia-fecha">· ${fmtCorto(fecha)}${fecha === hoy ? ' · hoy' : ''}</span>
              </div>
              <div class="row" style="gap:8px">
                <span class="tag">${llenas}/3</span>
                ${btnDia}
              </div>
            </div>
            <div class="grid grid-3" style="gap:10px">
              ${d.momentos.map((m) => casillaHTML(dia, m, d.plan[dia][m])).join('')}
            </div>
          </div>`;
      }).join('');

      actualizarBadgePeriodo();
      actualizarBotonFaltantes(d);
    }

    // La lista de compras solo tiene sentido cuando ya hay algo programado: con la semana
    // vacia no hay platos de los que sacar faltantes, y el boton devolvia una lista vacia
    // que parecia un error ("no me falta nada") en vez de "todavia no has planificado".
    function actualizarBotonFaltantes(d) {
      const programadas = d.dia_orden.reduce(
        (n, dia) => n + d.momentos.filter((m) => d.plan[dia][m]).length, 0
      );
      const btn = document.getElementById('btn-faltantes');
      // Sin el módulo de despensa no hay con qué comparar: "lo que falta" no significa nada,
      // así que la lista de compras no se ofrece.
      btn.classList.toggle('hidden', programadas === 0 || !U.despensa_activa);
      btn.title = `Ingredientes que te faltan para los ${programadas} plato(s) de esta semana`;
    }

    // Badge del periodo. OJO CON EL LENGUAJE: el periodo es de la COMPRA, no de la despensa.
    // Hay UNA sola despensa (es el estado de la casa hoy, la tabla no tiene columna de semana
    // ni de periodo); lo que cubre N semanas es la compra que la abastecio. Antes esto decia
    // "Despensa del periodo 27/07 – 02/08", que se lee como que cada semana tiene su propia
    // despensa, y de ahi salio la confusion. No vuelvas a ese texto.
    let PERIODO_ACTIVO = null;
    const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
    function actualizarBadgePeriodo() {
      const el = document.getElementById('badge-periodo');
      const p = PERIODO_ACTIVO;
      if (!p || !p.periodo_inicio || !p.periodo_fin) {
        el.innerHTML = '🛒 <span class="muted">Aún no registras una compra. En <a href="/despensa.html">Mi despensa</a> registras la compra que abastece tu despensa.</span>';
        return;
      }
      const rango = `${fmtCorto(p.periodo_inicio)} – ${fmtCorto(p.periodo_fin)}`;
      const N = Math.max(1, Math.round((diasEntre(p.periodo_inicio, p.periodo_fin) + 1) / 7));
      const dentro = semana >= p.periodo_inicio && semana <= p.periodo_fin;
      const x = Math.floor(diasEntre(p.periodo_inicio, semana) / 7) + 1;
      el.innerHTML = dentro
        ? `🛒 <b>Tu compra del ${rango}</b> cubre esta semana (${x} de ${N}) · <span class="muted">tienes una sola despensa; lo que cambia cada semana es cuánto se lleva</span>`
        : `🛒 <span class="muted">Esta semana está fuera del periodo de tu última compra (${rango}). Registra la compra de este periodo en Mi despensa.</span>`;
    }
    async function cargarPeriodo() {
      try { PERIODO_ACTIVO = (await api('/api/despensa/compras')).compras[0] || null; }
      catch { PERIODO_ACTIVO = null; }
    }

    // ===== Carga =====
    async function cargar(s) {
      limpiarAlerta(alPlan);
      try {
        DATA = await api('/api/plan' + (s ? `?semana=${s}` : ''));
        semana = DATA.semana;
        pintar();
        avisoSetup();
      } catch (err) {
        if (err.status === 403) { location.href = '/mi-plan.html?upgrade=1'; return; }
        alerta(alPlan, err.error || 'No pudimos cargar tu plan.');
      }
    }

    // Antes de generar hace falta hogar y despensa: se avisa arriba en vez de
    // dejar que el usuario descubra el problema al apretar "Generar día".
    //
    // Corre DESPUES del primer pintado (necesita consultar la despensa), asi que cuando
    // cambia el veredicto vuelve a pintar: los botones de IA de cada dia se pintan segun
    // setupPendiente y ya estan en pantalla para entonces.
    async function avisoSetup() {
      const box = document.getElementById('aviso-setup');
      if (!DATA.hogar_configurado) {
        mostrarSetup('👋 Configura tu hogar primero',
          'Necesitamos saber quiénes son y qué pueden comer para proponerte platos.', '/hogar.html', 'Ir a Mi hogar');
        return;
      }
      // La despensa es un módulo OPCIONAL: si el hogar no la activó, no se le exige llenarla
      // (y ni siquiera se consulta). Sin esto, quien decide no usarla vería para siempre un
      // aviso pidiéndole que registre una compra que no piensa registrar.
      if (U.despensa_activa) {
        try {
          const { despensa } = await api('/api/despensa');
          if (!despensa.length) {
            mostrarSetup('🛒 Tu despensa está vacía',
              'Registra tu compra de la semana para que la IA proponga platos con lo que ya tienes.', '/despensa.html', 'Ir a Mi despensa');
            return;
          }
        } catch { /* el aviso es orientativo: si falla, el backend igual valida */ }
      }
      box.classList.add('hidden');
      if (setupPendiente) { setupPendiente = false; pintar(); }
    }
    function mostrarSetup(titulo, texto, href, cta) {
      document.getElementById('setup-titulo').textContent = titulo;
      document.getElementById('setup-texto').textContent = texto;
      const a = document.getElementById('setup-link');
      a.href = href; a.textContent = cta;
      document.getElementById('aviso-setup').classList.remove('hidden');
      if (!setupPendiente) { setupPendiente = true; pintar(); }
    }

    // ===== Navegacion de semanas =====
    document.getElementById('btn-prev').onclick = () => cargar(sumar(semana, -7));
    document.getElementById('btn-next').onclick = () => cargar(sumar(semana, 7));
    document.getElementById('btn-hoy').onclick = () => cargar(DATA.semana_actual);

    // ===== Generar =====
    function cargando(btn, on, txt) {
      btn.disabled = on;
      if (on) { btn.dataset.txt = btn.textContent; btn.textContent = txt; }
      else if (btn.dataset.txt) btn.textContent = btn.dataset.txt;
    }

    // Completa la receta y/o el aporte nutricional de los platos de la semana que no los
    // tengan. Los platos nuevos ya nacen con los dos; esto es backfill de los viejos.
    document.getElementById('btn-detallar').onclick = async () => {
      const btn = document.getElementById('btn-detallar');
      cargando(btn, true, '🍳 Completando…');
      limpiarAlerta(alPlan);
      alerta(alPlan, '🍳 Pidiendo a la IA las recetas que faltan. Puede tardar medio minuto', 'info');
      try {
        const d = await api('/api/plan/detallar', { method: 'POST', body: { semana } });
        if (d.plan) DATA.plan = d.plan;
        if (d.limites) DATA.limites = { ...DATA.limites, ...d.limites };
        pintar();
        alerta(alPlan, d.mensaje, 'ok');
      } catch (err) { manejar(err); }
      finally { cargando(btn, false); }
    };

    // Pide platos a la IA para unas casillas. Es la unica via de generacion: un dia (3
    // casillas) o un plato suelto (1). Cuesta una generacion, sea 1 o 3.
    // LA BIBLIOTECA VA PRIMERO, SIEMPRE. Vale para "Proponer", para "Generar dia" y para
    // "cambiar este plato": si el usuario ya curo un plato que encaja, usarlo es mejor que
    // inventar otro — es suyo, ya le gusto, y no cuesta una generacion de IA.
    // Solo se llama a la IA por lo que la biblioteca no alcanzo a cubrir.
    //
    // reemplazar=true cuando la casilla YA tiene plato: ahi el usuario pidio cambiarlo.
    async function desdeBiblioteca(casillas, reemplazar) {
      try {
        const d = await api('/api/plan/desde-biblioteca', {
          method: 'POST', body: { semana, casillas, reemplazar },
        });
        DATA.plan = d.plan;
        return { puestos: d.puestos, faltan: d.faltan };
      } catch {
        // Si esto falla no se corta el flujo: se sigue con la IA, que es el camino de siempre.
        return { puestos: 0, faltan: casillas };
      }
    }

    async function generar(casillas, btn) {
      limpiarAlerta(alPlan);
      if (btn) cargando(btn, true, casillas.length > 1 ? '✨ Cocinando…' : '✨…');
      // AVISO OBLIGATORIO: la IA tarda ~3,5s por dia con Gemini y hasta ~30s si el admin pone
      // Claude de prioritario (medido). El boton de la casilla mide 11px y solo cabe "✨…":
      // sin un aviso grande el usuario se queda mirando una pantalla sin señales y cree que la
      // app no responde. Ya paso. Si tocas esto, deja algo que diga que se esta trabajando.
      const dia = casillas.length > 1;
      const esperando = modalCargando({
        ic: '👨‍🍳',
        titulo: dia ? 'Cocinando tu día…' : 'Pensando tu plato…',
        texto: dia
          ? 'Primero se usan tus platos guardados; lo que falte lo propone la IA.'
          : 'Primero se busca en tus platos guardados; si no encaja ninguno, lo propone la IA.',
        pasos: [
          '🧺 Revisando tu despensa…',
          '👨‍👩‍👧 Mirando las condiciones y alergias de tu hogar…',
          '🍲 Buscando platos de tu región…',
          '⚖️ Ajustando las porciones a tus comensales…',
          '📝 Escribiendo la receta y el aporte nutricional…',
        ],
      });
      try {
        // 1) Lo que ya tiene guardado. Sin IA y sin cupo.
        esperando.paso('📋 Buscando entre tus platos guardados…');
        const ocupadas = casillas.filter((c) => DATA.plan[c.dia] && DATA.plan[c.dia][c.momento]).length;
        const b = await desdeBiblioteca(casillas, ocupadas > 0);

        // 2) Solo lo que no se pudo cubrir va a la IA.
        let mensaje = b.puestos ? `${b.puestos} de tus platos guardados.` : '';
        if (b.faltan.length) {
          esperando.paso('✨ Pidiendo a la IA lo que falta…');
          const d = await api('/api/plan/generar', { method: 'POST', body: { semana, casillas: b.faltan } });
          DATA.plan = d.plan; DATA.limites = { ...DATA.limites, ...d.limites };
          mensaje = mensaje ? `${mensaje} ${d.mensaje}` : d.mensaje;
        }
        pintar();
        alerta(alPlan, mensaje || 'No se pudo llenar ninguna casilla.', 'ok');
      } catch (err) { pintar(); manejar(err); }
      // El modal se cierra SIEMPRE, tambien si la IA falla: si quedara abierto tras un 502, la
      // pantalla se quedaria bloqueada sin decir por que.
      finally { esperando.cerrar(); if (btn) cargando(btn, false); }
    }

    // El boton del dia. Por defecto llena SOLO las casillas vacias: el usuario mezcla
    // platos suyos con generados, y pisarle un plato que eligio a mano seria destruir su
    // trabajo. Si el dia ya esta lleno no hay nada que llenar, y rehacerlo se confirma.
    async function generarDia(dia, btn) {
      const vacias = DATA.momentos.filter((m) => !DATA.plan[dia][m]);
      if (vacias.length) {
        await generar(vacias.map((momento) => ({ dia, momento })), btn);
        return;
      }
      const ok = await confirmar(
        `Los 3 platos del <b>${DATA.dias[dia]}</b> ya están puestos. Esto los reemplaza por otros nuevos. ` +
        'Los platos que guardaste en tu biblioteca no se pierden.',
        { titulo: 'Rehacer el día completo', ok: 'Rehacer', peligro: true });
      if (!ok) return;
      await generar(DATA.momentos.map((momento) => ({ dia, momento })), btn);
    }

    function manejar(err) {
      if (err.status === 403 && err.upgrade) {
        alerta(alPlan, err.error + ' ');
        setTimeout(() => { location.href = '/mi-plan.html?upgrade=1'; }, 1800);
        return;
      }
      if (err.status === 409 && err.redirect) {
        alerta(alPlan, err.error);
        setTimeout(() => { location.href = err.redirect; }, 1800);
        return;
      }
      alerta(alPlan, err.error || 'Ocurrió un error.');
    }

    // ===== Acciones del calendario =====
    document.getElementById('calendario').addEventListener('click', async (e) => {
      const t = e.target.closest('button');
      if (!t) return;

      if (t.dataset.genDia) {
        await generarDia(Number(t.dataset.genDia), t);
        return;
      }
      if (t.dataset.gen) {
        const [dia, momento] = t.dataset.gen.split(':');
        await generar([{ dia: Number(dia), momento }], t);
        return;
      }
      if (t.dataset.lib) {
        const [dia, momento] = t.dataset.lib.split(':');
        await elegirDeBiblioteca(Number(dia), momento);
        return;
      }
      if (t.dataset.cocinado) {
        const it = buscarItem(Number(t.dataset.cocinado));
        try { DATA.plan = (await api(`/api/plan/${t.dataset.cocinado}`, { method: 'PATCH', body: { cocinado: !it.cocinado } })).plan; pintar(); }
        catch (err) { manejar(err); }
        return;
      }
      if (t.dataset.del) {
        const ok = await confirmar('¿Quitar este plato del día?', { titulo: 'Vaciar casilla', ok: 'Quitar', peligro: true });
        if (!ok) return;
        try { DATA.plan = (await api(`/api/plan/${t.dataset.del}`, { method: 'DELETE' })).plan; pintar(); }
        catch (err) { manejar(err); }
        return;
      }
      if (t.dataset.ver) verPlato(buscarItem(Number(t.dataset.ver)));
    });

    const buscarItem = (id) => {
      for (const d of DATA.dia_orden) for (const m of DATA.momentos) {
        const it = DATA.plan[d][m];
        if (it && it.id === id) return it;
      }
      return null;
    };

    // Cobertura: solo la tienen los platos que el usuario PROPUSO y la IA verifico
    // (plan_comidas.cobertura). Es lo primero que quiere ver quien escribio "aji de
    // gallina": si le alcanza y si le conviene.
    const VEREDICTO_INFO = {
      alcanza:       { cls: 'sem-verde-bn',    ic: '✓', txt: 'Te alcanza con lo que tienes' },
      alcanza_justo: { cls: 'sem-amarillo-bn', ic: '!', txt: 'Te alcanza, pero justo' },
      falta_comprar: { cls: 'sem-amarillo-bn', ic: '🛒', txt: 'Te falta comprar' },
    };

    function bloqueCobertura(cob) {
      if (!cob) return '';
      const v = VEREDICTO_INFO[cob.veredicto] || VEREDICTO_INFO.falta_comprar;
      // Las advertencias van PRIMERO y en rojo: pueden decir que el plato lleva un
      // alergeno del hogar. Es lo mas importante de toda la pantalla.
      const adv = (cob.advertencias || []).length
        ? `<div class="sem-banner sem-rojo-bn" style="align-items:flex-start;margin-bottom:10px">
             <span class="sem-dot" style="margin-top:5px"></span>
             <span>${cob.advertencias.map((a) => esc(a)).join('<br>')}</span>
           </div>`
        : '';
      const listar = (arr, vacio) => (arr || []).length
        ? (arr || []).map((x) => esc(x)).join(', ')
        : vacio;
      return `<div style="margin-top:4px;margin-bottom:12px">
        ${adv}
        <div class="sem-banner ${v.cls}"><span class="sem-dot"></span><span>${v.ic} ${v.txt}</span></div>
        <p class="muted" style="font-size:12.5px;margin-top:8px">
          ✓ <b>Ya tienes:</b> ${listar(cob.tengo, '—')}<br>
          🛒 <b>Te falta:</b> ${listar(cob.faltantes, 'nada, tienes todo')}
        </p>
      </div>`;
    }

    // Detalle del plato: ingredientes, faltantes, nota, cobertura (si lo propuso el
    // usuario), aporte nutricional y receta.
    function verPlato(it) {
      if (!it) return;
      const p = it.plato;
      const ing = p.ingredientes.map((i) => {
        const falta = p.faltantes.some((f) => f.toLowerCase() === String(i.nombre).toLowerCase());
        // Lo que FALTA sigue destacado en ambar con su carrito: el icono no debe tapar esa
        // senal, que es la que dice si hay que ir al mercado.
        return `<div class="ing-linea"${falta ? ' style="color:var(--amber);font-weight:700"' : ''}>`
          + `<span class="ing-ic ing-ic-sm">${iconoIngrediente(i.nombre)}</span>`
          + `<span>${[i.cantidad, i.unidad, i.nombre].filter(Boolean).join(' ')}${falta ? ' 🛒' : ''}</span></div>`;
      }).join('');
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:520px;text-align:left">
        <h3>${p.nombre}</h3>
        <div class="modal-body">
          <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">
            <span class="tag">${MOMENTO_INFO[it.momento].ic} ${MOMENTO_INFO[it.momento].txt}</span>
            ${p.tiempo_min ? `<span class="tag">⏱ ${p.tiempo_min}′</span>` : ''}
            ${p.dificultad ? `<span class="tag">${p.dificultad}</span>` : ''}
            <span class="tag">🍽 ${p.porciones} porciones</span>
          </div>
          ${U.despensa_activa ? bloqueCobertura(it.cobertura) : ''}
          ${p.nota ? `<p style="background:var(--green-soft);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px">💡 ${p.nota}</p>` : ''}
          <b style="font-size:13px">Ingredientes</b>
          <ul style="margin:8px 0 12px 18px;font-size:13.5px;line-height:1.7">${ing || '<li class="muted">Sin detalle</li>'}</ul>
          ${it.cobertura ? '' : (p.faltantes.length
            ? `<p class="muted" style="font-size:12.5px">🛒 <b>Te falta comprar:</b> ${p.faltantes.join(', ')}</p>`
            : '<p class="muted" style="font-size:12.5px">✓ Tienes todo en tu despensa.</p>')}
          ${bloqueNutri(p.info)}
          ${p.pasos && p.pasos.length
            ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
                 <b style="font-size:13px">🍳 Cómo prepararlo</b>
                 <ol style="margin:8px 0 0 18px;font-size:13.5px;line-height:1.7">${p.pasos.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
               </div>`
            : `<div class="reco-foto" style="margin-top:12px">🍳 Este plato todavía no tiene su receta.
                 Usa <b>“Completar platos”</b> arriba para pedírsela a la IA.</div>`}
        </div>
        <div class="row" style="justify-content:space-between">
          <button class="btn btn-ghost btn-sm" data-guardar>${p.guardado ? '★ En mi biblioteca' : '☆ Guardar en mi biblioteca'}</button>
          <button class="btn btn-ghost btn-sm" data-cerrar>Cerrar</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      back.querySelector('[data-cerrar]').onclick = () => back.remove();
      back.onclick = (e) => { if (e.target === back) back.remove(); };

      // Guardar en la biblioteca: lo que la IA propuso es efimero (un plato generado que
      // sale del calendario y no esta guardado se borra, ver limpiarPlatoHuerfano). Este
      // boton es como el usuario CURA lo que le gusto. El tope platos_max se aplica al
      // guardar -> 403 {upgrade}.
      const btnG = back.querySelector('[data-guardar]');
      btnG.onclick = async () => {
        const guardado = p.guardado;
        cargando(btnG, true, '…');
        try {
          await api(`/api/platos/${p.id}/guardar`, { method: guardado ? 'DELETE' : 'POST' });
          p.guardado = !guardado;
          cargando(btnG, false);
          btnG.textContent = p.guardado ? '★ En mi biblioteca' : '☆ Guardar en mi biblioteca';
          alerta(alPlan, p.guardado ? 'Plato guardado en "Mis platos".' : 'Plato quitado de tu biblioteca.', 'ok');
        } catch (err) {
          cargando(btnG, false);
          back.remove();
          manejar(err);
        }
      };
    }

    // ===== 3a via: el usuario ESCRIBE el plato y la IA verifica si le alcanza =====

    // ===== Poner un plato de MI BIBLIOTECA en una casilla =====
    // La 2a via para llenar el calendario, junto a la IA. No gasta cupo ni llama a la IA:
    // apunta la casilla a un plato que el usuario ya curo en "Mis platos".
    //
    // Un plato SIN momento encaja en cualquier casilla (el formulario lo permite vacio);
    // por eso el filtro por defecto es "los de este momento + los que no tienen momento",
    // con un interruptor para ver la biblioteca entera.
    async function elegirDeBiblioteca(dia, momento) {
      let datos;
      try { datos = await api('/api/platos'); }
      catch (err) { manejar(err); return; }

      const mi = MOMENTO_INFO[momento];
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:520px;text-align:left">
        <h3>Poner un plato en ${DATA.dias[dia]}</h3>
        <p class="muted" style="font-size:13px;margin-bottom:12px">${mi.ic} ${mi.txt} · elige uno de tus platos guardados.${
          momento === 'desayuno' ? ' Solo se muestran desayunos.' : ' Se muestran almuerzos y cenas.'}</p>
        <div class="modal-body">
          <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
            <input class="input" id="lib-q" placeholder="Buscar en mis platos…" style="flex:1;min-width:160px" />
            <label class="row" style="gap:6px;font-size:13px;font-weight:500;white-space:nowrap">
              <input type="checkbox" id="lib-todos" /> Ver todos
            </label>
          </div>
          <div id="lib-lista" class="stack" style="gap:8px;max-height:320px;overflow-y:auto"></div>
        </div>
        <div class="row"><button class="btn btn-ghost btn-sm" data-cerrar>Cancelar</button></div>
      </div>`;
      document.body.appendChild(back);
      const cerrar = () => back.remove();
      back.querySelector('[data-cerrar]').onclick = cerrar;
      back.onclick = (e) => { if (e.target === back) cerrar(); };

      const lista = back.querySelector('#lib-lista');
      const inputQ = back.querySelector('#lib-q');
      const chkTodos = back.querySelector('#lib-todos');

      // Que platos encajan en esta casilla:
      //   desayuno -> solo desayunos (un seco de res no es un desayuno)
      //   almuerzo o cena -> los DOS, porque en una casa peruana se comen indistintamente
      // Un plato SIN momento sirve para cualquiera.
      const encaja = (m) => {
        if (!m) return true;
        if (momento === 'desayuno') return m === 'desayuno';
        return m === 'almuerzo' || m === 'cena';
      };

      function pintarLista() {
        const q = inputQ.value.trim().toLowerCase();
        const platos = datos.platos
          .filter((p) => chkTodos.checked || encaja(p.momento))
          .filter((p) => !q || p.nombre.toLowerCase().includes(q));

        if (!datos.platos.length) {
          lista.innerHTML = `<div class="reco-foto">
            📋 Todavía no tienes platos guardados. Créalos en <a href="/platos.html"><b>Mis platos</b></a>,
            o guarda ahí los que te proponga la IA.</div>`;
          return;
        }
        if (!platos.length) {
          lista.innerHTML = `<p class="muted" style="font-size:13px">Ninguno de tus platos coincide.
            ${!chkTodos.checked ? 'Prueba con <b>Ver todos</b>.' : ''}</p>`;
          return;
        }
        lista.innerHTML = platos.map((p) => {
          const tags = [
            p.momento ? `<span class="tag">${MOMENTO_INFO[p.momento].ic} ${MOMENTO_INFO[p.momento].txt}</span>` : '',
            p.tiempo_min ? `<span class="tag">⏱ ${p.tiempo_min}′</span>` : '',
            p.pasos && p.pasos.length ? '<span class="tag">🍳 con pasos</span>' : '',
          ].filter(Boolean).join('');
          return `<button class="card" data-plato="${p.id}" style="cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);padding:10px 12px">
            <b style="font-size:14px">${esc(p.nombre)}</b>
            <div class="casilla-meta" style="margin-top:6px">${tags}</div>
          </button>`;
        }).join('');
      }
      pintarLista();
      inputQ.oninput = pintarLista;
      chkTodos.onchange = pintarLista;

      lista.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-plato]');
        if (!b) return;
        cerrar();
        limpiarAlerta(alPlan);
        try {
          const d = await api('/api/plan', { method: 'POST', body: { semana, dia, momento, plato_id: Number(b.dataset.plato) } });
          DATA.plan = d.plan;
          pintar();
          alerta(alPlan, 'Plato puesto en tu calendario.', 'ok');
        } catch (err) { manejar(err); }
      });
    }

    // ===== Generar la semana completa =====
    //
    // 🔴 SOLO LLENA LAS CASILLAS VACIAS. Nunca pisa lo que ya hay, y esa es la condicion que
    // permitio traer de vuelta este boton: la vieja ruta de "generar la semana" se elimino el
    // 2026-07-15 porque BORRABA la semana antes de escribir, y destruia los platos que el
    // usuario habia puesto a mano. Si algun dia se cambia esto, se vuelve a romper eso.
    //
    // Va DIA POR DIA desde el navegador, no en una sola llamada al servidor: con Claude de
    // prioridad, 7 dias serian ~210 s y nginx corta a los 180. Ademas asi se ve el progreso y
    // cada dia que se completa queda guardado aunque el siguiente falle.
    document.getElementById('btn-semana').onclick = () => {
      const bloqueo = bloqueoGen();
      if (bloqueo && setupPendiente) { alerta(alPlan, bloqueo); return; }
      preguntarSemana();
    };

    function preguntarSemana() {
      const dias = DATA.dia_orden.map((d) => ({ d, txt: DATA.dias[d], fecha: fechaDe(d) }));
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:520px;text-align:left">
        <h3>✨ Generar la semana</h3>
        <div class="modal-body">
          <p class="muted" style="font-size:13px;margin-bottom:14px">
            Se llenarán <b>solo las casillas vacías</b>: lo que ya pusiste no se toca.
            Primero se usan tus <b>platos guardados</b> y, si no alcanzan, los propone la IA.
          </p>

          <div class="field">
            <label>¿Qué días?</label>
            <div class="row" style="gap:6px;flex-wrap:wrap" id="sem-dias">
              ${dias.map((x) => `<label class="chip-check"><input type="checkbox" value="${x.d}" checked /> ${x.txt}</label>`).join('')}
            </div>
            <div class="row" style="gap:6px;margin-top:6px">
              <button class="btn btn-ghost btn-sm" type="button" data-dias="todos">Todos</button>
              <button class="btn btn-ghost btn-sm" type="button" data-dias="ninguno">Ninguno</button>
            </div>
          </div>

          <div class="field">
            <label>¿Qué comidas?</label>
            <div class="row" style="gap:6px;flex-wrap:wrap" id="sem-momentos">
              ${DATA.momentos.map((m) => `<label class="chip-check"><input type="checkbox" value="${m}" checked /> ${MOMENTO_INFO[m].ic} ${MOMENTO_INFO[m].txt}</label>`).join('')}
            </div>
          </div>

          <div class="reco-foto" id="sem-resumen" style="font-size:12.5px"></div>
        </div>
        <div class="row" style="justify-content:flex-end;gap:8px">
          <button class="btn btn-ghost btn-sm" type="button" data-cerrar>Cancelar</button>
          <button class="btn btn-sm" type="button" data-ok>Generar</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      const cerrar = () => back.remove();
      back.querySelector('[data-cerrar]').onclick = cerrar;
      back.onclick = (e) => { if (e.target === back) cerrar(); };

      const marcados = (sel) => [...back.querySelectorAll(sel + ' input:checked')].map((i) => i.value);
      // El resumen dice CUANTAS casillas se van a llenar y cuantas generaciones puede costar,
      // antes de gastarlas: una semana entera puede consumir el cupo del plan Free de un golpe.
      function repintarResumen() {
        const ds = marcados('#sem-dias').map(Number);
        const ms = marcados('#sem-momentos');
        let vacias = 0;
        for (const d of ds) for (const m of ms) if (!DATA.plan[d][m]) vacias++;
        const diasConHueco = ds.filter((d) => ms.some((m) => !DATA.plan[d][m])).length;
        const cupo = DATA.limites.generaciones_max == null
          ? 'ilimitadas'
          : `te quedan ${Math.max(0, DATA.limites.generaciones_max - DATA.limites.generaciones_usadas)}`;
        back.querySelector('#sem-resumen').innerHTML = vacias
          ? `Se llenarán <b>${vacias} casilla(s) vacía(s)</b>. Si tu biblioteca no alcanza,
             costará hasta <b>${diasConHueco} generación(es)</b> de IA (${cupo}).`
          : 'Esas casillas ya están todas llenas: no hay nada que generar.';
        back.querySelector('[data-ok]').disabled = !vacias;
      }
      back.querySelectorAll('#sem-dias input, #sem-momentos input').forEach((i) => { i.onchange = repintarResumen; });
      back.querySelector('[data-dias="todos"]').onclick = () => {
        back.querySelectorAll('#sem-dias input').forEach((i) => { i.checked = true; }); repintarResumen();
      };
      back.querySelector('[data-dias="ninguno"]').onclick = () => {
        back.querySelectorAll('#sem-dias input').forEach((i) => { i.checked = false; }); repintarResumen();
      };
      repintarResumen();

      back.querySelector('[data-ok]').onclick = () => {
        const ds = marcados('#sem-dias').map(Number);
        const ms = marcados('#sem-momentos');
        if (!ds.length || !ms.length) return;
        cerrar();
        generarSemana(ds, ms);
      };
    }

    async function generarSemana(dias, momentos) {
      limpiarAlerta(alPlan);
      const esperando = modalCargando({
        ic: '📅',
        titulo: 'Armando tu semana…',
        texto: 'Primero con tus platos guardados y luego con la IA, día por día.',
        pasos: ['📋 Revisando tus platos guardados…'],
      });
      let deBiblioteca = 0; let generados = 0; let corte = null; const fallidos = [];
      try {
        // 1) Lo que ya tiene. Sin IA y sin cupo: aprovechar su biblioteca antes de pagar.
        const b = await api('/api/plan/desde-biblioteca', { method: 'POST', body: { semana, dias, momentos } });
        deBiblioteca = b.puestos;
        DATA.plan = b.plan;

        // 2) Lo que falte, con IA y UN DIA POR LLAMADA (es la unidad de generacion).
        const porDia = new Map();
        for (const f of b.faltan) {
          if (!porDia.has(f.dia)) porDia.set(f.dia, []);
          porDia.get(f.dia).push(f.momento);
        }
        const total = porDia.size;
        let i = 0;
        for (const [dia, moms] of porDia) {
          i++;
          esperando.paso(`✨ Generando ${DATA.dias[dia]} (${i} de ${total})…`);
          try {
            const d = await api('/api/plan/generar', {
              method: 'POST',
              body: { semana, casillas: moms.map((m) => ({ dia, momento: m })) },
            });
            DATA.plan = d.plan;
            DATA.limites = { ...DATA.limites, ...d.limites };
            generados += moms.length;
          } catch (err) {
            // Un dia que falla NO tumba la semana. La IA devuelve JSON malformado a ratos (visto
            // en produccion: "Expected ',' or ']'"), y parar en el primero dejaba los otros seis
            // dias sin intentar siquiera. Lo generado ya esta guardado.
            //
            // Sin CUPO si se para: los intentos siguientes fallarian todos igual y solo servirian
            // para hacer esperar al usuario.
            fallidos.push(DATA.dias[dia]);
            corte = err.error || 'La IA no pudo con algun dia.';
            if (err.upgrade || /cupo|generacion|generación/i.test(String(err.error || ''))) break;
          }
        }
      } catch (err) {
        corte = err.error || 'No pudimos armar la semana.';
      } finally {
        esperando.cerrar();
      }

      pintar();
      const partes = [];
      if (deBiblioteca) partes.push(`${deBiblioteca} de tus platos guardados`);
      if (generados) partes.push(`${generados} generado(s) con IA`);
      const hecho = partes.length ? `Semana armada: ${partes.join(' y ')}.` : 'No se llenó ninguna casilla.';
      // Se nombran los días que no se pudieron: "quedó a medias" sin decir cuáles obliga a
      // revisar el calendario entero para encontrar los huecos.
      if (fallidos.length) corte = `No se pudo con: ${fallidos.join(', ')}. Vuelve a intentarlo con el botón de cada día.`;
      alerta(alPlan, corte ? `${hecho} ${corte}` : hecho, corte ? 'info' : 'ok');
      cargar(semana);
    }

    // ===== Ver mi despensa (con la proyeccion de ESTA semana) =====
    // Se le pasa la ventana de la semana visible. Sin eso, la despensa proyectaba SIEMPRE la
    // semana actual: mirabas el plan del 13/07, entrabas a la despensa y las barras te
    // hablaban del 27/07 — el numero no correspondia a la semana que tenias delante.
    // Con la despensa apagada se retiran su boton y el badge del periodo.
    if (!U.despensa_activa) {
      document.getElementById('btn-despensa').classList.add('hidden');
      document.getElementById('badge-periodo').classList.add('hidden');
    }
    document.getElementById('btn-despensa').onclick = () => {
      location.href = `/despensa.html?inicio=${semana}&fin=${sumar(semana, 6)}`;
    };

    // Lleva a "Mis compras" con LA SEMANA QUE SE ESTA VIENDO, igual que el boton de la
    // despensa: la lista se arma de los platos de esa semana, no de la semana actual.
    document.getElementById('btn-compras').onclick = () => {
      location.href = `/compras.html?inicio=${semana}&fin=${sumar(semana, 6)}`;
    };

    // ===== Copiar semana =====
    document.getElementById('btn-copiar').onclick = async () => {
      let semanas = [];
      try { semanas = (await api('/api/plan/semanas')).semanas.filter((s) => s.semana !== semana); }
      catch { /* se maneja abajo */ }
      if (!semanas.length) { alerta(alPlan, 'No tienes otra semana con platos para copiar.'); return; }

      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" style="text-align:left">
        <h3>Copiar una semana</h3>
        <div class="modal-body">
          <p class="muted" style="font-size:13px;margin-bottom:10px">Se copiarán sus platos a la semana del ${fmtCorto(semana)}, reemplazando lo que haya.</p>
          <select class="input" id="sel-copiar">${semanas.map((s) => `<option value="${s.semana}">${fmtCorto(s.semana)} — ${fmtCorto(sumar(s.semana, 6))} (${s.items} platos)</option>`).join('')}</select>
        </div>
        <div class="row">
          <button class="btn btn-ghost btn-sm" data-no>Cancelar</button>
          <button class="btn btn-sm" data-si>Copiar aquí</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      back.querySelector('[data-no]').onclick = () => back.remove();
      back.onclick = (e) => { if (e.target === back) back.remove(); };
      back.querySelector('[data-si]').onclick = async () => {
        const desde = back.querySelector('#sel-copiar').value;
        back.remove();
        try {
          const d = await api('/api/plan/copiar', { method: 'POST', body: { desde, hacia: semana } });
          DATA.plan = d.plan; pintar();
          alerta(alPlan, `${d.copiados} plato(s) copiados.`, 'ok');
        } catch (err) { manejar(err); }
      };
    };

    // ===== Lista de compras (faltantes del periodo) =====
    // Consolida en UNA lista los faltantes de la semana visible: lo que la IA marco al
    // generar + lo que arrojo verificar un plato propuesto. Sin IA (datos ya en la BD).
    document.getElementById('btn-faltantes').onclick = verFaltantes;

    async function verFaltantes() {
      const inicio = semana;
      const fin = sumar(semana, 6);
      let data;
      try { data = await api(`/api/plan/faltantes?inicio=${inicio}&fin=${fin}`); }
      catch (err) { alerta(alPlan, err.error || 'No pudimos armar la lista de compras.'); return; }

      const cuerpo = data.total === 0
        ? '<p class="muted">No hay faltantes esta semana. O ya tienes todo en tu despensa, o aún no has generado ni verificado platos.</p>'
        : data.por_categoria.map((g) => `
            <div style="margin-bottom:12px">
              <div style="margin-bottom:6px">${chipCategoria(g.categoria)}</div>
              <ul style="margin:0 0 0 18px;font-size:13.5px;line-height:1.8">
                ${g.items.map((i) => `<li>${esc(i.nombre)}${
                  // La cantidad va PRIMERO y en negrita: es lo que se lee delante del puesto.
                  // Puede faltar (platos manuales sin cantidad): entonces se omite, no se
                  // inventa un "1". Ver "medida" en GET /api/plan/faltantes.
                  i.medida ? ` — <b>${esc(i.medida)}</b>` : ''
                }${i.casillas > 1 ? ` <span class="muted" style="font-size:12px">×${i.casillas} platos</span>` : ''}${i.fuentes.includes('propuesto') && !i.fuentes.includes('generado') ? ' <span class="muted" style="font-size:11px">· verificado</span>' : ''}</li>`).join('')}
              </ul>
            </div>`).join('');

      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:520px;text-align:left">
        <h3>🛒 Lista de compras</h3>
        <div class="modal-body">
          <p class="muted" style="font-size:12.5px;margin-bottom:12px">Del ${fmtCorto(inicio)} al ${fmtCorto(fin)} · ${data.total} ingrediente(s) que te faltan, ordenados por pasillo del mercado.</p>
          ${cuerpo}
        </div>
        <div class="row" style="justify-content:space-between">
          <button class="btn btn-sm" data-pdf${data.total ? '' : ' disabled'}>⬇ Descargar PDF</button>
          <button class="btn btn-ghost btn-sm" data-cerrar>Cerrar</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      back.querySelector('[data-cerrar]').onclick = () => back.remove();
      back.onclick = (e) => { if (e.target === back) back.remove(); };
      if (data.total) back.querySelector('[data-pdf]').onclick = () => faltantesPDF(data, inicio, fin);
    }

    // jsPDF se carga BAJO DEMANDA (al pulsar Descargar), no en cada carga del plan: es una
    // libreria pesada que casi nadie usa por visita, y ademas toca <canvas> al evaluarse
    // (lo que rompia el smoke en jsdom). Vendorizada en /js/vendor.
    function cargarJsPDF() {
      return new Promise((resolve, reject) => {
        if (window.jspdf && window.jspdf.jsPDF) return resolve();
        const s = document.createElement('script');
        s.src = '/js/vendor/jspdf.umd.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('No se pudo cargar el generador de PDF.'));
        document.head.appendChild(s);
      });
    }

    // PDF con fuentes estandar (helvetica/WinAnsi): sin emojis ni simbolos raros — se usa
    // "[ ]" como casilla para ir marcando en el mercado.
    async function faltantesPDF(data, inicio, fin) {
      try { await cargarJsPDF(); }
      catch (e) { alerta(alPlan, e.message); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const M = 48;
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      let y = 60;
      const salto = (h) => { if (y > H - h) { doc.addPage(); y = 60; } };

      doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
      doc.text('Lista de compras', M, y); y += 22;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(120);
      doc.text(`NutriChefIA  ·  del ${fmtCorto(inicio)} al ${fmtCorto(fin)}  ·  ${data.total} ingredientes`, M, y);
      y += 26; doc.setTextColor(20);

      for (const g of data.por_categoria) {
        salto(90);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text((CAT_INFO[g.categoria]?.txt || g.categoria).toUpperCase(), M, y); y += 8;
        doc.setDrawColor(205); doc.line(M, y, W - M, y); y += 18;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
        for (const i of g.items) {
          salto(50);
          // La CANTIDAD va en negrita y pegada al nombre: es el dato que se lee de un vistazo
          // delante del puesto del mercado. El "(xN platos)" es contexto, va al final y en gris.
          const x = M + 4;
          doc.text(`[ ]   ${i.nombre}`, x, y);
          if (i.medida) {
            const ancho = doc.getTextWidth(`[ ]   ${i.nombre}`);
            doc.setFont('helvetica', 'bold');
            doc.text(` —  ${i.medida}`, x + ancho, y);
            doc.setFont('helvetica', 'normal');
          }
          if (i.casillas > 1) {
            doc.setTextColor(130);
            doc.text(`(en ${i.casillas} platos)`, W - M, y, { align: 'right' });
            doc.setTextColor(30);
          }
          y += 20;
        }
        y += 10;
      }
      doc.save(`lista-compras-${inicio}.pdf`);
    }

    cargarPeriodo().then(cargar);
  </script>
</body>
</html>
