<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriChefIA — Mis Recetas</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/img/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/img/favicon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#124819" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="hamb">☰</button>
        <h2>Mis Recetas</h2>
        <div class="spacer"></div>
        <span class="analisis-pill" id="pill-platos">…</span>
      </header>

      <div class="content stack">
        <div class="card card-tint">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div>
              <h3 style="margin-bottom:4px">Tu recetario</h3>
              <p class="muted" style="font-size:13px;max-width:60ch">
                Aquí guardas las recetas que quieres reutilizar: las tuyas de siempre y las que
                te gustaron del menú. Desde el calendario puedes ponerlas en cualquier casilla.
              </p>
            </div>
            <button class="btn" id="btn-nuevo" type="button">+ Nueva receta</button>
          </div>
          <div id="alerta" class="alert" style="margin-top:12px"></div>
        </div>

        <div class="card">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
            <h3>Guardados <span class="muted" id="cont" style="font-weight:400;font-size:14px"></span></h3>
          </div>

          <!-- Los filtros los resuelve el SERVIDOR (ver la ruta): en pantalla solo hay una
               pagina, asi que filtrar aqui contaria sobre 12 platos y no sobre la biblioteca. -->
          <div class="filtros-platos">
            <input id="buscar" class="input" placeholder="🔎 Buscar por nombre…" />
            <select id="filtro-momento" class="input" title="Desayuno, almuerzo o cena">
              <option value="">🍽️ Momento</option>
            </select>
            <select id="filtro-origen" class="input" title="Los que escribiste tú o los que generó la IA">
              <option value="">👤 Origen</option>
              <option value="mio">✍️ Míos</option>
              <option value="ia">✨ De la IA</option>
            </select>
            <select id="filtro-uso" class="input" title="Si ya los pusiste alguna vez en el calendario">
              <option value="">📅 Uso</option>
              <option value="en_plan">📅 Programados</option>
              <option value="sin_usar">💤 Sin usar</option>
            </select>
            <select id="filtro-dificultad" class="input" title="Qué tan fácil es prepararlo">
              <option value="">🔥 Dificultad</option>
              <option value="facil">🟢 Fácil</option>
              <option value="media">🟡 Media</option>
              <option value="dificil">🔴 Difícil</option>
            </select>
            <select id="filtro-orden" class="input" title="En qué orden se listan">
              <option value="reciente">🕒 Recientes</option>
              <option value="antiguo">🕘 Antiguos</option>
              <option value="nombre">🔤 Por nombre</option>
              <option value="tiempo">⏱️ Más rápidos</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="btn-limpiar" type="button" hidden>✕ Quitar filtros</button>
          </div>

          <div id="lista" class="stack"><p class="muted">Cargando…</p></div>
          <div class="paginacion" id="paginacion" hidden>
            <button class="btn btn-ghost btn-sm" id="pag-antes" type="button">‹ Anterior</button>
            <span class="muted" id="pag-txt"></span>
            <button class="btn btn-ghost btn-sm" id="pag-sigue" type="button">Siguiente ›</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <datalist id="dl-ingredientes"></datalist>

  <img class="mascota" src="/img/mascota-platos.png" alt="" aria-hidden="true" />

  <script src="/js/api.js"></script>
  <script>
    exigirSesion();
    document.getElementById('sidebar').innerHTML = pintarSidebar('platos');
    activarMenuMovil();

    const al = document.getElementById('alerta');
    let PLATOS = [];
    // Cuantos platos entran en una pagina. 12 llena la pantalla sin obligar a bajar mucho, y
    // deja la paginacion en 6 paginas para una biblioteca de ~70 platos.
    const POR_PAGINA = 12;
    let PAGINA = 1;
    let META = { total: 0, paginas: 1, resumen: { total: 0, mios: 0, ia: 0, en_plan: 0, sin_usar: 0 } };
    let LIMITE = { max: null, usados: 0, ilimitado: true, restantes: null };
    let MOMENTOS = [];
    let DIFICULTADES = [];
    let ING_SUGERENCIAS = []; // productos de la despensa + catalogo, para autocompletar ingredientes

    // Trae los productos de la despensa (y el catalogo) para sugerirlos al anotar ingredientes.
    // Si el plan no incluye planificador (403), se queda sin sugerencias: sigues escribiendo libre.
    async function cargarSugerenciasIng() {
      try {
        const d = await api('/api/despensa');
        const vistos = new Set();
        const lista = [];
        for (const it of [...(d.despensa || []), ...(d.catalogo || [])]) {
          const k = it.nombre.trim().toLowerCase();
          if (k && !vistos.has(k)) { vistos.add(k); lista.push(it.nombre.trim()); }
        }
        ING_SUGERENCIAS = lista;
        const dl = document.getElementById('dl-ingredientes');
        if (dl) dl.innerHTML = ING_SUGERENCIAS.map((n) => `<option value="${esc(n)}"></option>`).join('');
      } catch { /* sin despensa disponible: sin sugerencias */ }
    }

    const DIF_TXT = { facil: '🟢 Fácil', media: '🟡 Media', dificil: '🔴 Difícil' };
    // esc() vive en api.js (helper compartido).

    function avisar(msg, tipo = 'error') {
      al.textContent = msg;
      al.className = `alert alert-${tipo} show`;
      setTimeout(() => al.classList.remove('show'), 4000);
    }

    // ===== Listado =====
    function pintarPill() {
      const p = document.getElementById('pill-platos');
      p.innerHTML = LIMITE.ilimitado
        ? `🍲 ${LIMITE.usados} platos`
        : `🍲 ${LIMITE.usados} de ${LIMITE.max}`;
    }

    function tarjeta(p) {
      const m = MOMENTO_INFO[p.momento];
      const ings = p.ingredientes.slice(0, 6).map((i) => esc(i.nombre)).join(' · ');
      const mas = p.ingredientes.length > 6 ? ` +${p.ingredientes.length - 6}` : '';
      return `
        <div class="result-section">
          <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
            <span class="plato-ic">${iconoPlato(p.nombre, p.momento)}</span>
            <div style="min-width:0;flex:1">
              <h4 style="margin-bottom:6px">${esc(p.nombre)}</h4>
              <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">
                ${m ? `<span class="cat-chip">${m.ic} ${m.txt}</span>` : ''}
                <span class="cat-chip">👥 ${p.porciones} porc.</span>
                ${p.tiempo_min ? `<span class="cat-chip">⏱️ ${p.tiempo_min} min</span>` : ''}
                ${p.dificultad ? `<span class="cat-chip">${DIF_TXT[p.dificultad] || p.dificultad}</span>` : ''}
                ${p.origen === 'manual' ? '<span class="cat-chip">✍️ Tuyo</span>' : '<span class="cat-chip">✨ De la IA</span>'}
                ${p.en_plan ? `<span class="cat-chip cat-verdura">📅 En el plan (${p.en_plan})</span>` : ''}
              </div>
              ${ings ? `<p class="muted" style="font-size:13px">${ings}${mas}</p>` : '<p class="muted" style="font-size:13px">Sin ingredientes anotados.</p>'}
              ${p.nota ? `<p class="muted" style="font-size:13px;margin-top:6px">📝 ${esc(p.nota)}</p>` : ''}
            </div>
            <div class="row" style="gap:6px">
              <button class="btn btn-ghost btn-sm" data-ver="${p.id}">Ver</button>
              <button class="btn btn-ghost btn-sm" data-editar="${p.id}">Editar</button>
              <button class="btn btn-danger btn-sm" data-borrar="${p.id}">Borrar</button>
            </div>
          </div>
        </div>`;
    }

    // Que filtros hay puestos ahora mismo (el buscador cuenta como uno).
    function filtrosPuestos() {
      return ['buscar', 'filtro-momento', 'filtro-origen', 'filtro-uso', 'filtro-dificultad']
        .some((id) => document.getElementById(id).value.trim());
    }

    function pintar() {
      const cont = document.getElementById('lista');
      const desde = (PAGINA - 1) * POR_PAGINA + 1;
      const hasta = desde + PLATOS.length - 1;
      // "1-12 de 28" y no solo "28": con paginacion, un contador que no dice CUALES estas viendo
      // hace pensar que la pagina 2 son otros 12 platos ademas de los 28.
      document.getElementById('cont').textContent = META.total
        ? (META.total > PLATOS.length ? `· ${desde}-${hasta} de ${META.total}` : `· ${META.total}`)
        : '';
      document.getElementById('btn-limpiar').hidden = !filtrosPuestos();
      pintarPill();
      pintarPaginacion();

      if (!PLATOS.length) {
        // Sin platos y sin resultados NO son lo mismo: al segundo se le ofrece quitar los
        // filtros, no crear un plato que ya podria tener.
        cont.innerHTML = filtrosPuestos()
          ? `<p class="muted">Ningún plato de tu biblioteca coincide con lo que buscas.
               <button class="btn btn-ghost btn-sm" type="button" data-limpiar>Quitar los filtros</button></p>`
          : `<p class="muted">
              Todavía no guardas ninguna receta. Crea una con “+ Nueva receta”, o guarda las que te
              gusten del <a href="/plan.html" style="color:var(--primary);font-weight:600">plan de comidas</a>.
            </p>`;
        return;
      }
      cont.innerHTML = PLATOS.map(tarjeta).join('');
    }

    function pintarPaginacion() {
      const caja = document.getElementById('paginacion');
      caja.hidden = META.paginas <= 1;
      if (caja.hidden) return;
      document.getElementById('pag-txt').textContent = `Página ${PAGINA} de ${META.paginas}`;
      document.getElementById('pag-antes').disabled = PAGINA <= 1;
      document.getElementById('pag-sigue').disabled = PAGINA >= META.paginas;
    }

    // Los conteos de la biblioteca entera van en las propias opciones: asi se sabe que hay
    // detras de cada filtro sin tener que probarlos uno por uno.
    function etiquetarFiltros() {
      const r = META.resumen || {};
      const poner = (sel, valor, txt) => {
        const o = document.querySelector(`#${sel} option[value="${valor}"]`);
        if (o) o.textContent = txt;
      };
      poner('filtro-origen', 'mio', `✍️ Míos (${r.mios || 0})`);
      poner('filtro-origen', 'ia', `✨ De la IA (${r.ia || 0})`);
      poner('filtro-uso', 'en_plan', `📅 Programados (${r.en_plan || 0})`);
      poner('filtro-uso', 'sin_usar', `💤 Sin usar (${r.sin_usar || 0})`);
    }

    async function cargar() {
      const params = new URLSearchParams();
      const val = (id) => document.getElementById(id).value.trim();
      if (val('buscar')) params.set('q', val('buscar'));
      if (val('filtro-momento')) params.set('momento', val('filtro-momento'));
      if (val('filtro-origen')) params.set('origen', val('filtro-origen'));
      if (val('filtro-uso')) params.set('uso', val('filtro-uso'));
      if (val('filtro-dificultad')) params.set('dificultad', val('filtro-dificultad'));
      params.set('orden', val('filtro-orden') || 'reciente');
      params.set('por_pagina', POR_PAGINA);
      params.set('pagina', PAGINA);

      try {
        const r = await api(`/api/platos?${params}`);
        PLATOS = r.platos;
        // El servidor topa la pagina contra el total: al filtrar estando en la 4 quedarian 2, y
        // hay que quedarse con la que de verdad se devolvio o los botones irian a otra parte.
        PAGINA = r.pagina || 1;
        META = { total: r.total ?? r.platos.length, paginas: r.paginas || 1, resumen: r.resumen || META.resumen };
        etiquetarFiltros();
        LIMITE = r.limite;
        if (!MOMENTOS.length) {
          MOMENTOS = r.momentos;
          DIFICULTADES = r.dificultades;
          document.getElementById('filtro-momento').innerHTML =
            '<option value="">🍽️ Momento</option>' +
            MOMENTOS.map((m) => `<option value="${m}">${MOMENTO_INFO[m].ic} ${MOMENTO_INFO[m].txt}</option>`).join('');
        }
        pintar();
      } catch (e) {
        if (e.status === 403 && e.upgrade) { location.href = e.redirect || '/mi-plan.html'; return; }
        document.getElementById('lista').innerHTML = `<p class="muted">No se pudo cargar: ${esc(e.error || 'error')}</p>`;
      }
    }

    // Cualquier filtro devuelve a la pagina 1: seguir en la 3 despues de filtrar deja al usuario
    // mirando una lista vacia aunque haya resultados.
    function desdeElPrincipio() { PAGINA = 1; cargar(); }

    let debounce;
    document.getElementById('buscar').oninput = () => { clearTimeout(debounce); debounce = setTimeout(desdeElPrincipio, 250); };
    for (const id of ['filtro-momento', 'filtro-origen', 'filtro-uso', 'filtro-dificultad', 'filtro-orden']) {
      document.getElementById(id).onchange = desdeElPrincipio;
    }

    function limpiarFiltros() {
      for (const id of ['buscar', 'filtro-momento', 'filtro-origen', 'filtro-uso', 'filtro-dificultad']) {
        document.getElementById(id).value = '';
      }
      desdeElPrincipio();
    }
    document.getElementById('btn-limpiar').onclick = limpiarFiltros;

    function irAPagina(n) {
      PAGINA = Math.min(META.paginas, Math.max(1, n));
      // scrollIntoView no existe en jsdom (donde corren los smokes) y su ausencia no debe tumbar
      // la navegacion: subir al principio de la lista es una cortesia, no la funcion.
      cargar().then(() => document.getElementById('lista').scrollIntoView?.({ behavior: 'smooth', block: 'start' }));
    }
    document.getElementById('pag-antes').onclick = () => irAPagina(PAGINA - 1);
    document.getElementById('pag-sigue').onclick = () => irAPagina(PAGINA + 1);

    // ===== Acciones de cada tarjeta =====
    document.getElementById('lista').addEventListener('click', async (e) => {
      if (e.target.closest('[data-limpiar]')) return limpiarFiltros();
      const ver = e.target.closest('[data-ver]');
      const editar = e.target.closest('[data-editar]');
      const borrar = e.target.closest('[data-borrar]');
      if (ver) return verPlato(+ver.dataset.ver);
      if (editar) return abrirForm(PLATOS.find((p) => p.id === +editar.dataset.editar));
      if (borrar) return borrarPlato(+borrar.dataset.borrar);
    });

    function verPlato(id) {
      const p = PLATOS.find((x) => x.id === id);
      if (!p) return;
      const ings = p.ingredientes.length
        ? `<div style="margin:0 0 14px">${p.ingredientes.map((i) => `<div class="ing-linea"><span class="ing-ic ing-ic-sm">${iconoIngrediente(i.nombre)}</span><span>${esc(i.nombre)}${i.cantidad ? ` — <b>${esc(i.cantidad)} ${esc(i.unidad)}</b>` : ''}</span></div>`).join('')}</div>`
        : '<p class="muted" style="margin-bottom:14px">Sin ingredientes anotados.</p>';
      const pasos = p.pasos?.length
        ? `<h4 style="margin-bottom:6px">Preparación</h4><ol style="margin:0 0 14px 18px">${p.pasos.map((s) => `<li style="margin-bottom:4px">${esc(s)}</li>`).join('')}</ol>`
        : '<p class="muted" style="margin-bottom:14px">Este plato todavía no tiene pasos de preparación.</p>';

      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:560px">
        <h3><span style="margin-right:6px">${iconoPlato(p.nombre, p.momento)}</span>${esc(p.nombre)}</h3>
        <div class="modal-body">
          <h4 style="margin-bottom:6px">Ingredientes</h4>
          ${ings}
          ${pasos}
          ${p.nota ? `<div class="reco-foto">📝 ${esc(p.nota)}</div>` : ''}
        </div>
        <div class="row"><button class="btn btn-ghost btn-sm" data-cerrar>Cerrar</button></div>
      </div>`;
      document.body.appendChild(back);
      back.querySelector('[data-cerrar]').onclick = () => back.remove();
      back.onclick = (ev) => { if (ev.target === back) back.remove(); };
    }

    async function borrarPlato(id) {
      const p = PLATOS.find((x) => x.id === id);
      if (!p) return;
      // Aviso honesto: la FK de plan_comidas es ON DELETE CASCADE, asi que borrar el plato
      // tambien lo saca de las casillas del calendario donde este puesto.
      const extra = p.en_plan
        ? `<br><br>⚠️ Está puesto en <b>${p.en_plan} casilla(s)</b> de tu plan de comidas. Al borrarlo también se quitará de ahí.`
        : '';
      const si = await confirmar(`¿Borrar <b>${esc(p.nombre)}</b>?${extra}`, { titulo: 'Borrar plato', ok: 'Borrar', peligro: true });
      if (!si) return;
      try {
        const r = await api(`/api/platos/${id}`, { method: 'DELETE' });
        avisar(r.quitado_del_plan ? `Plato borrado (se quitó de ${r.quitado_del_plan} casilla/s del plan).` : 'Plato borrado.', 'ok');
        cargar();
      } catch (e) { avisar(e.error || 'No se pudo borrar'); }
    }

    // ===== Formulario (crear / editar) =====
    function filaIngrediente(i = { nombre: '', cantidad: '', unidad: '' }) {
      return `<div class="row" data-fila style="gap:6px;margin-bottom:6px">
        <input class="input" data-i-nombre list="dl-ingredientes" placeholder="Ingrediente (de tu despensa o nuevo)" value="${esc(i.nombre)}" style="flex:2" />
        <input class="input" data-i-cant placeholder="Cant." value="${esc(i.cantidad)}" style="flex:.6" />
        <input class="input" data-i-uni placeholder="Unidad" value="${esc(i.unidad)}" style="flex:.8" />
        <button class="btn btn-ghost btn-sm" type="button" data-quitar>✕</button>
      </div>`;
    }

    function abrirForm(plato = null) {
      // El tope solo bloquea CREAR: editar un plato que ya esta guardado no suma uno nuevo.
      if (!plato && !LIMITE.ilimitado && LIMITE.restantes <= 0) {
        confirmar(
          `Tu plan permite guardar <b>${LIMITE.max} plato(s)</b> y ya los usaste.<br><br>Puedes borrar uno para hacer espacio, o pasar a un plan superior.`,
          { titulo: 'Biblioteca llena', ok: 'Ver planes' }
        ).then((si) => { if (si) location.href = '/mi-plan.html'; });
        return;
      }

      const p = plato || { nombre: '', momento: '', porciones: 2, tiempo_min: '', dificultad: '', nota: '', ingredientes: [], pasos: [] };
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:620px">
        <h3>${plato ? 'Editar receta' : 'Nueva receta'}</h3>
        <div class="modal-body">
          <div id="alerta-form" class="alert"></div>
          <div class="field">
            <label>Nombre del plato *</label>
            <input id="f-nombre" placeholder="Ej: Ají de gallina de la abuela" value="${esc(p.nombre)}" />
          </div>
          <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
            <div class="field" style="margin:0;flex:1;min-width:130px">
              <label>Momento</label>
              <select id="f-momento" class="input">
                <option value="">—</option>
                ${MOMENTOS.map((m) => `<option value="${m}" ${p.momento === m ? 'selected' : ''}>${MOMENTO_INFO[m].ic} ${MOMENTO_INFO[m].txt}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="margin:0;width:100px">
              <label>Porciones</label>
              <input id="f-porciones" type="number" min="1" value="${p.porciones || 2}" />
            </div>
            <div class="field" style="margin:0;width:110px">
              <label>Minutos</label>
              <input id="f-tiempo" type="number" min="1" placeholder="30" value="${p.tiempo_min || ''}" />
            </div>
            <div class="field" style="margin:0;flex:1;min-width:130px">
              <label>Dificultad</label>
              <select id="f-dificultad" class="input">
                <option value="">—</option>
                ${DIFICULTADES.map((d) => `<option value="${d}" ${p.dificultad === d ? 'selected' : ''}>${DIF_TXT[d] || d}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="field">
            <label>Ingredientes <span class="muted" style="font-weight:400">(elígelos de tu despensa o escribe uno nuevo)</span></label>
            <div id="f-ings">${(p.ingredientes.length ? p.ingredientes : [{}, {}]).map(filaIngrediente).join('')}</div>
            <button class="btn btn-ghost btn-sm" type="button" id="f-add-ing">+ Agregar ingrediente</button>
          </div>

          <div class="field">
            <label>Preparación <span class="muted" style="font-weight:400">(un paso por línea)</span></label>
            <textarea id="f-pasos" rows="5" placeholder="Sancochar la papa&#10;Licuar el ají con la leche">${esc((p.pasos || []).join('\n'))}</textarea>
          </div>

          <div class="field" style="margin-bottom:0">
            <label>Nota <span class="muted" style="font-weight:400">(adaptaciones, avisos)</span></label>
            <input id="f-nota" placeholder="Ej: sin sal para la hipertensión de papá" value="${esc(p.nota || '')}" />
          </div>
        </div>
        <div class="row">
          <button class="btn btn-ghost btn-sm" data-cancelar>Cancelar</button>
          <button class="btn btn-sm" data-guardar>${plato ? 'Guardar cambios' : 'Crear plato'}</button>
        </div>
      </div>`;
      document.body.appendChild(back);

      const cerrar = () => back.remove();
      back.querySelector('[data-cancelar]').onclick = cerrar;
      back.onclick = (ev) => { if (ev.target === back) cerrar(); };
      back.querySelector('#f-add-ing').onclick = () => {
        back.querySelector('#f-ings').insertAdjacentHTML('beforeend', filaIngrediente());
      };
      back.querySelector('#f-ings').addEventListener('click', (ev) => {
        if (ev.target.closest('[data-quitar]')) ev.target.closest('[data-fila]').remove();
      });

      back.querySelector('[data-guardar]').onclick = async () => {
        const nombre = back.querySelector('#f-nombre').value.trim();
        const alF = back.querySelector('#alerta-form');
        if (!nombre) {
          alF.textContent = 'Ponle un nombre al plato.';
          alF.className = 'alert alert-error show';
          return;
        }
        const ingredientes = [...back.querySelectorAll('[data-fila]')].map((f) => ({
          nombre: f.querySelector('[data-i-nombre]').value.trim(),
          cantidad: f.querySelector('[data-i-cant]').value.trim(),
          unidad: f.querySelector('[data-i-uni]').value.trim(),
        })).filter((i) => i.nombre);

        const cuerpo = {
          nombre,
          momento: back.querySelector('#f-momento').value || null,
          porciones: +back.querySelector('#f-porciones').value || 1,
          tiempo_min: +back.querySelector('#f-tiempo').value || null,
          dificultad: back.querySelector('#f-dificultad').value || null,
          nota: back.querySelector('#f-nota').value.trim() || null,
          ingredientes,
          pasos: back.querySelector('#f-pasos').value.split('\n').map((s) => s.trim()).filter(Boolean),
        };

        try {
          if (plato) await api(`/api/platos/${plato.id}`, { method: 'PUT', body: cuerpo });
          else await api('/api/platos', { method: 'POST', body: cuerpo });
          cerrar();
          avisar(plato ? 'Plato actualizado.' : 'Plato creado.', 'ok');
          cargar();
        } catch (e) {
          if (e.status === 403 && e.upgrade) { cerrar(); location.href = e.redirect || '/mi-plan.html'; return; }
          alF.textContent = e.error || 'No se pudo guardar';
          alF.className = 'alert alert-error show';
        }
      };
    }

    // ===== Tres vias para sumar un plato a la biblioteca =====
    //
    // Son las mismas tres del calendario, y a proposito: el usuario ya las conoce de ahi.
    // La diferencia es que aqui el plato NO ocupa una casilla, nace guardado para reutilizarlo.
    //
    // El tope del plan (platos_max) se comprueba primero: abrir un formulario o gastar una
    // generacion de IA para luego rechazar el guardado seria peor que avisar antes.
    document.getElementById('btn-nuevo').onclick = () => {
      // Mismo criterio que abrirForm(): el tope se avisa ANTES de elegir via, para no
      // gastar una generacion de IA en un plato que despues no se podria guardar.
      if (LIMITE && !LIMITE.ilimitado && LIMITE.restantes <= 0) {
        confirmar(
          `Tu plan permite guardar <b>${LIMITE.max} plato(s)</b> y ya los usaste.<br><br>Puedes borrar uno para hacer espacio, o pasar a un plan superior.`,
          { titulo: 'Biblioteca llena', ok: 'Ver planes' }
        ).then((si) => { if (si) location.href = '/mi-plan.html'; });
        return;
      }
      elegirComoCrear();
    };

    function elegirComoCrear() {
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:520px;text-align:left">
        <h3>+ Nueva receta</h3>
        <div class="modal-body">
          <p class="muted" style="font-size:13px;margin-bottom:14px">
            Se guardará en tu biblioteca para que puedas ponerlo en el calendario cuantas veces quieras.
          </p>
          <button class="btn btn-ghost via-crear" type="button" data-via="manual">
            <span class="via-ic">✍️</span>
            <span><b>Agregarlo yo mismo</b>
              <span class="muted">Escribes el nombre, los ingredientes y los pasos. Sin IA.</span></span>
          </button>
          <button class="btn btn-ghost via-crear" type="button" data-via="nombre">
            <span class="via-ic">🪄</span>
            <span><b>Escribo el nombre y lo genera la IA</b>
              <span class="muted">Tú dices qué plato quieres y la IA arma la receta adaptada a tu hogar.</span></span>
          </button>
          <button class="btn btn-ghost via-crear" type="button" data-via="proponer">
            <span class="via-ic">✨</span>
            <span><b>Que la IA me proponga uno</b>
              <span class="muted">Elige un plato que aún no tengas, según tu región y tu familia.</span></span>
          </button>
          <p class="muted" style="font-size:11.5px;margin-top:12px">
            Las dos opciones con IA gastan una generación de tu plan.
          </p>
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" type="button" data-cerrar>Cancelar</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      const cerrar = () => back.remove();
      back.querySelector('[data-cerrar]').onclick = cerrar;
      back.onclick = (e) => { if (e.target === back) cerrar(); };
      back.querySelectorAll('[data-via]').forEach((b) => {
        b.onclick = () => {
          cerrar();
          if (b.dataset.via === 'manual') abrirForm();
          else if (b.dataset.via === 'nombre') pedirNombreYGenerar();
          else generarConIA({ cuantos: 1 });
        };
      });
    }

    // Vía 2: el usuario escribe QUÉ quiere y la IA lo desarrolla.
    function pedirNombreYGenerar() {
      const back = document.createElement('div');
      back.className = 'modal-back show';
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:460px;text-align:left">
        <h3>🪄 ¿Qué plato quieres?</h3>
        <div class="modal-body">
          <div class="field">
            <label>Nombre del plato</label>
            <input id="g-nombre" placeholder="Ej: Ají de gallina, Tallarín saltado…" autocomplete="off" />
          </div>
          <div class="field">
            <label>¿Para qué momento? (opcional)</label>
            <select id="g-momento" class="input">
              <option value="">Cualquiera</option>
              <option value="desayuno">🌅 Desayuno</option>
              <option value="almuerzo" selected>☀️ Almuerzo</option>
              <option value="cena">🌙 Cena</option>
            </select>
          </div>
          <p class="muted" style="font-size:12.5px">
            La IA escribirá la receta con las cantidades para tu hogar, respetando alergias y condiciones médicas.
          </p>
        </div>
        <div class="row" style="justify-content:flex-end;gap:8px">
          <button class="btn btn-ghost btn-sm" type="button" data-cerrar>Cancelar</button>
          <button class="btn btn-sm" type="button" data-ok>Generar plato</button>
        </div>
      </div>`;
      document.body.appendChild(back);
      const cerrar = () => back.remove();
      back.querySelector('[data-cerrar]').onclick = cerrar;
      back.onclick = (e) => { if (e.target === back) cerrar(); };
      const input = back.querySelector('#g-nombre');
      setTimeout(() => input.focus(), 50);
      const lanzar = () => {
        const nombre = input.value.trim();
        if (!nombre) { input.focus(); return; }
        const momento = back.querySelector('#g-momento').value;
        cerrar();
        generarConIA({ nombres: [nombre], momento });
      };
      back.querySelector('[data-ok]').onclick = lanzar;
      input.onkeydown = (e) => { if (e.key === 'Enter') lanzar(); };
    }

    // Llamada comun a las dos vías con IA.
    async function generarConIA(body) {
      limpiarAlerta(al);
      const proponiendo = !body.nombres;
      const esperando = modalCargando({
        ic: proponiendo ? '✨' : '🪄',
        titulo: proponiendo ? 'Buscando un plato para ti…' : 'Escribiendo la receta…',
        texto: proponiendo
          ? 'La IA está eligiendo un plato que aún no tengas en tu biblioteca.'
          : 'La IA está armando la receta con las cantidades de tu hogar.',
        pasos: [
          '👨‍👩‍👧 Mirando las condiciones y alergias de tu hogar…',
          '🍲 Buscando platos de tu región…',
          '⚖️ Ajustando las porciones a tus comensales…',
          '📝 Escribiendo la receta y el aporte nutricional…',
        ],
      });
      try {
        const d = await api('/api/platos/generar', { method: 'POST', body });
        await cargar();
        alerta(al, d.mensaje, 'ok');
      } catch (err) {
        if (err.upgrade) { alerta(al, err.error); return; }
        alerta(al, err.error || 'No pudimos generar el plato.');
      } finally { esperando.cerrar(); }
    }

    cargar();
    cargarSugerenciasIng();
  </script>
</body>
</html>
